# Gradle configuration for the Nobogent Android build.
#
# Memory is sized for a modest developer laptop, not a CI machine. The Flutter
# template ships `-Xmx8G`, which exceeds the physical RAM of the machine this was
# built on (7.7 GB total) and crashes the Gradle daemon with a native
# "insufficient memory" OOM. These values are deliberately small and still build
# this single-module app comfortably.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -Dfile.encoding=UTF-8

# Compile Kotlin in-process: a second daemon would need another gigabyte.
kotlin.daemon.jvmargs=-Xmx768m
kotlin.compiler.execution.strategy=in-process

# One module — parallelism buys nothing here and costs memory.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configureondemand=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The Kotlin incremental cache in this environment became corrupt after a JVM
# out-of-memory crash, so incremental compilation is disabled for reliability.
kotlin.incremental=false
