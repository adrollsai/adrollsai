name: nobogent_mobile
description: "Nobogent — the AI business command center for Android and iOS."
publish_to: 'none'

# versionName / CFBundleShortVersionString +1 = versionCode / CFBundleVersion.
# Continues the version line of the existing Capacitor shell (1.0.2 / code 3)
# so this build can be shipped as an upgrade on the existing store listings.
version: 2.0.0+4

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State + navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3

  # Data / backend (Supabase GoTrue auth + PostgREST, shared with the PWA)
  supabase_flutter: ^2.18.3
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6

  # Media
  cached_network_image: ^4.0.6
  video_player: ^2.14.1
  image_picker: ^1.2.4
  flutter_svg: ^2.3.2

  # Platform integration
  permission_handler: ^13.0.2
  url_launcher: ^6.3.3
  share_plus: ^13.3.1

  # Utilities
  intl: ^0.20.3
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/demo/

  # Inter ships as one variable font (opsz,wght) so the app keeps the exact
  # typographic voice of the Nobogent web product with no runtime font fetch.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
